<main class="sa-main">
  <div class="sa-header">
    <h1>Lojas</h1>
  </div>

  <div class="sa-busca">
    <input type="text" id="input-busca" placeholder="Buscar por nome, cidade ou owner...">
  </div>
  <div class="sa-filtros">
    <select id="filtro-status">
      <option value="todas">Status: todas</option>
      <option value="trial">Trial</option>
      <option value="ativa">Ativa</option>
      <option value="cancelada">Cancelada</option>
      <option value="nenhum">Sem assinatura</option>
    </select>
    <select id="filtro-plano">
      <option value="todos">Plano: todos</option>
      <option value="Autônomo">Autônomo</option>
      <option value="Salao">Salão</option>
      <option value="Salao Pro">Salão Pro</option>
      <option value="nenhum">Sem plano</option>
    </select>
  </div>
  <div class="sa-table-wrap">
    <table class="sa-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Cidade</th>
          <th>Plano</th>
          <th>Status</th>
          <th>Profissionais</th>
          <th>Agendamentos</th>
        </tr>
      </thead>
      <tbody id="tbody-lojas">
        <tr>
          <td colspan="7" style="text-align:center; color:var(--text-muted); padding:32px 0;">Carregando...</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script src="../shared/js/shared.js"></script>
<script src="js/super-auth.js"></script>
<script src="js/lojas.js"></script>
