<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/super-admin/">
  <link rel="icon" type="image/png" href="../public/assets/cortecertologo.png">
  <title>Super Admin · Corte Comigo</title>
  <script src="../shared/js/tema-inicio.js"></script>
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="sa.css">
  <style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: system-ui, -apple-system, sans-serif;
  }
  .sa-login-card {
    background: var(--paper-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow-lg);
  }
  .sa-login-brand {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .sa-login-brand span {
    color: var(--brass);
  }
  .sa-login-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: .85rem;
    margin-bottom: 28px;
  }
  .sa-form-group {
    margin-bottom: 18px;
  }
  .sa-form-group label {
    display: block;
    color: var(--text-muted);
    font-size: .8rem;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .sa-form-group input {
    width: 100%;
    padding: 12px 14px;
    background: var(--field-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: .95rem;
    font-family: system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    outline: none;
    transition: border-color .2s;
  }
  .sa-form-group input:focus {
    border-color: var(--brass);
  }
  .sa-btn-entrar {
    width: 100%;
    padding: 12px;
    background: var(--brass);
    border: none;
    border-radius: 8px;
    color: var(--ink);
    font-size: .95rem;
    font-weight: 600;
    font-family: system-ui, -apple-system, sans-serif;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity .2s;
  }
  .sa-btn-entrar:hover {
    opacity: .88;
  }
  .sa-btn-entrar:disabled {
    opacity: .5;
    cursor: not-allowed;
  }
  .sa-error-msg {
    color: var(--danger);
    font-size: .82rem;
    text-align: center;
    margin-top: 12px;
    display: none;
  }
</style>
</head>
<body>

<div class="sa-login-card">
  <div class="sa-login-brand">Corte<span>Comigo</span></div>
  <p class="sa-login-subtitle">Painel do Super Admin</p>

  <form id="sa-login-form">
    <div class="sa-form-group">
      <label for="sa-email">E-mail</label>
      <input type="email" id="sa-email" placeholder="admin@cortecomigo.com" required>
    </div>
    <div class="sa-form-group">
      <label for="sa-senha">Senha</label>
      <input type="password" id="sa-senha" placeholder="Sua senha" required>
    </div>
    <button type="submit" class="sa-btn-entrar" id="sa-btn-entrar">Entrar</button>
    <div class="sa-error-msg" id="sa-error-msg"></div>
  </form>
</div>

<script src="../shared/js/shared.js"></script>
<script src="js/sa-login.js"></script>
</body>
</html>
