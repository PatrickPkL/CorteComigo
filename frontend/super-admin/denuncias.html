</head>
<body>

      <span>Dashboard</span>
    </a>
    <a href="planos.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Planos</span>
    </a>
    <a href="relatorios.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>

    <a href="denuncias.html" class="active">

    <a href="suporte-sa.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
      <span>Suporte</span>
    </a>
    <a href="bot.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="20" height="12" rx="2"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><circle cx="8" cy="13" r="1"/><circle cx="16" cy="13" r="1"/><path d="M9 17h6"/></svg>

    <a href="chats.html">

  <div class="sa-sidebar-footer">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Sair</span>
    </a>
  </div>
</aside>

<main class="sa-main">
  <div class="sa-header">
    <h1>Denúncias de Perfis</h1>
    <div class="sa-header-extra">
      <div class="sa-count">Pendentes: <strong id="sa-total-pendentes">0</strong></div>
    </div>
  </div>

  <div class="sa-filtros" id="sa-filtros">
    <button class="sa-filtro-btn active" data-status="todos">Todos</button>
    <button class="sa-filtro-btn" data-status="pendente">Pendente</button>
    <button class="sa-filtro-btn" data-status="investigando">Investigando</button>
    <button class="sa-filtro-btn" data-status="resolvido">Resolvido</button>
    <button class="sa-filtro-btn" data-status="rejeitado">Rejeitado</button>
  </div>

  <div class="sa-filtros" id="sa-filtros-tipo">
    <button class="sa-filtro-btn active" data-tipo="todos">Todos os tipos</button>
    <button class="sa-filtro-btn" data-tipo="salao">Salão</button>
    <button class="sa-filtro-btn" data-tipo="barbeiro">Barbeiro</button>
    <button class="sa-filtro-btn" data-tipo="cliente">Cliente</button>
  </div>

  <div class="sa-table-wrap">
    <table class="sa-table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Alvo</th>
          <th>Denunciante</th>
          <th>Motivo</th>
          <th>Detalhes</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbody-denuncias">
        <tr><td colspan="7" class="sa-vazio">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- modal -->
<div class="sa-modal" id="sa-modal">
  <div class="sa-modal-box">
    <h3 id="sa-modal-titulo">Revisar Denúncia</h3>
    <div class="sa-modal-meta" id="sa-modal-meta"></div>
    <div class="sa-modal-block">
      <div class="lbl">Alvo denunciado</div>
      <div class="txt" id="sa-modal-alvo"></div>
    </div>
    <div class="sa-modal-block">
      <div class="lbl">Detalhes da denúncia</div>
      <div class="txt" id="sa-modal-detalhes"></div>
    </div>
    <input type="hidden" id="sa-modal-id">
    <div class="sa-modal-field">
      <div class="lbl">Status</div>
      <select id="sa-modal-status">
        <option value="pendente">Pendente</option>
        <option value="investigando">Investigando</option>
        <option value="resolvido">Resolvido</option>
        <option value="rejeitado">Rejeitado</option>
      </select>
    </div>
    <div class="sa-modal-field">
      <div class="lbl">Anotação de moderação (opcional)</div>
      <textarea id="sa-modal-nota" placeholder="Registre a decisão tomada..."></textarea>
    </div>
    <div class="sa-modal-actions">
      <button class="sa-btn sa-btn-ghost" id="sa-modal-cancel">Cancelar</button>
      <button class="sa-btn sa-btn-brass" id="sa-modal-salvar">Salvar</button>
    </div>
  </div>
</div>

<script src="../shared/js/shared.js"></script>
<script src="js/super-auth.js"></script>
<script src="js/denuncias-sa.js"></script>
</body>
</html>
